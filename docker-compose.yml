services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-route_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-route_tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-route_tracker}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # 5433 on the host so it doesn't clash with a local Postgres install.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      # First boot initializes the cluster and PostGIS extensions, which is slow on Docker Desktop.
      start_period: 120s

  web:
    build: ./backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-insecure-key}
      # "web" is the Host header the frontend's dev proxy sends from inside Docker.
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-route_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-route_tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-route_tracker}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      # Keep node_modules inside the container instead of on the Windows bind mount.
      - frontend_node_modules:/app/node_modules
    environment:
      API_PROXY_TARGET: http://web:8000
      VITE_USE_POLLING: "true"
    ports:
      - "5173:5173"
    depends_on:
      - web

volumes:
  pgdata:
  frontend_node_modules:
