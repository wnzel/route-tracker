x-backend-env: &backend-env
  DJANGO_DEBUG: "true"
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-insecure-key}
  # "web" is the Host header the frontend's dev proxy sends from inside Docker.
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-route_tracker}
  POSTGRES_USER: ${POSTGRES_USER:-route_tracker}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-route_tracker}

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-route_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-route_tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-route_tracker}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # 5433 on the host so it doesn't clash with a local Postgres install.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      # First boot initializes the cluster and PostGIS extensions, which is slow on Docker Desktop.
      start_period: 120s

  web:
    build: ./backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    environment: *backend-env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  mcp:
    build: ./backend
    command: python manage.py mcp_server --transport http --host 0.0.0.0 --port 8001
    volumes:
      - ./backend:/app
    environment:
      <<: *backend-env
      # Local development token. Set MCP_TOKEN in .env to something secret before exposing this.
      MCP_TOKEN: ${MCP_TOKEN:-local-dev-token}
      MCP_ALLOWED_HOSTS: localhost:8001,127.0.0.1:8001
    ports:
      # Bound to this machine only.
      - "127.0.0.1:8001:8001"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      # Keep node_modules inside the container instead of on the Windows bind mount.
      - frontend_node_modules:/app/node_modules
    environment:
      API_PROXY_TARGET: http://web:8000
      VITE_USE_POLLING: "true"
    ports:
      - "5173:5173"
    depends_on:
      - web

volumes:
  pgdata:
  frontend_node_modules:
